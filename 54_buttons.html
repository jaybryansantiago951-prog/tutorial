<!doctype html>
<html>
  <head>
    <style>
      .testbtn {
        background-color: green;
        color: yellow;
        font-size: 15px;
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .testbtn:hover {
        background-color: rgb(15, 146, 15);
      }
    </style>
  </head>
  <body>
    <h1>HTML Buttons</h1>

    <p>Default button with no styling:</p>
    <button>Click me</button>

    <p>Styled button:</p>
    <button class="testbtn">Green Button</button>

    <p>A disabled button is unclickable:</p>
    <button disabled>Disabled Button</button>

    <button onclick="alert('Hello!')">Click Me</button>
  </body>
</html>
