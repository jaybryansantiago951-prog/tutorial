<!doctype html>
<html>
  <head>
    <style>
      .exiframe {
        width: 100%;
        height: 300px;
        border: none;
      }
    </style>
  </head>
  <body>
    <h2>Remove the Iframe Border</h2>
    <p>To remove the default border of the iframe, use CSS:</p>

    <iframe
      src="./26_imagebackground.html"
      class="exiframe"
      title="Iframe Example"
    ></iframe>

    <iframe
      src="./24_images.html"
      class="exiframe"
      title="Iframe Example"
    ></iframe>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/K3x9VIzc8B0?si=25HT-kCUQQwM4Tpo"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
