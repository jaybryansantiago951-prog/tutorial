<!doctype html>
<html>
  <body>
    <h2>Iframe - Target for a Link</h2>

    <iframe
      src="./19_links.html"
      name="iframe_a"
      height="300px"
      width="100%"
      title="Iframe Example"
    ></iframe>

    <p>
      <a href="https://cssgridgarden.com/" target="iframe_a">cssGridGarden</a>
    </p>

    <p>
      When the target attribute of a link matches the name of an iframe, the
      link will open in the iframe.
    </p>
  </body>
</html>
